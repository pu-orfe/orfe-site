<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ORFE | Princeton University</title>
  <style>
    :root { color-scheme: light dark; --fg: #1a1a1a; --bg: #ffffff; --accent: #e77500; }
    @media (prefers-color-scheme: dark) { :root { --fg: #f2f2f2; --bg: #121212; } }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 0 16px; text-align: center;
    }
    h1 { font-size: clamp(2rem, 8vw, 4rem); margin: 0 0 0.5rem; }
    p { margin: 0; opacity: 0.8; }
    .bar { width: 4rem; height: 4px; background: var(--accent); margin: 1rem auto; border-radius: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, world!</h1>
    <div class="bar"></div>
    <p>Operations Research and Financial Engineering</p>
  </main>
</body>
</html>
